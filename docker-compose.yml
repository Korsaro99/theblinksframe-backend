# Local development: Postgres plus a Liquibase runner for migrations.
# The API itself runs on the host with `make run`.
name: blinks

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blinks}
      POSTGRES_USER: ${POSTGRES_USER:-blinks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blinks}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Run with `make migrate` (docker compose run --rm liquibase update).
  liquibase:
    build:
      context: ./db
      dockerfile: liquibase.Dockerfile
    image: blinks-liquibase:5.0.4
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-blinks}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-blinks}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-blinks}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_SHOW_BANNER: "false"
      LIQUIBASE_ANALYTICS_ENABLED: "false"
    volumes:
      - ./db/changelog:/liquibase/changelog:ro

volumes:
  pgdata:
