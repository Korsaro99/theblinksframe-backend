version: "2"

run:
  build-tags: [integration]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    misspell:
      locale: UK # the brief is written in British English: colour, catalogue
    revive:
      rules:
        - name: exported
          disabled: true # doc comments are encouraged, not enforced
  exclusions:
    generated: strict
    presets: [comments, std-error-handling]
    rules:
      # Test SQL is built from constants, and tests do not need request contexts.
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [theblinksframe-backend]
