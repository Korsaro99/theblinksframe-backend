# Casbin model: role-based access control on API routes.
# A request is (role, route template, HTTP method), e.g. (STAFF, /api/v1/admin/orders/:orderId, PATCH).
# Routes are gin's templates, not the raw URL, so ids in the path cannot confuse matching.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (p.act == "*" || r.act == p.act)
